name: Release

# Release intent is a tag, not a diff. Pushing `v*` is the only trigger, and the
# tag ruleset restricts tag creation to repository admins — so merging a pull
# request can never publish, no matter what it contains. A version bump on main
# is inert on its own: it only records the version the next tag must match.
# This also makes skipped versions normal. Bump 0.0.11 -> 0.99.0 in one pull
# request, tag v0.99.0, and 0.0.12..0.98.x simply never exist — the same pattern
# pi follows (npm shows 0.87.1 on 2026-09-22 then 0.99.0 on 2026-09-29, with
# nothing published in between).
on:
  push:
    tags: ["v*"]

# Serialize re-runs of the same tag; never cancel a publish in flight.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  # Required to create the GitHub Release and upload its tarball asset.
  contents: write
  # Required for npm provenance (OIDC).
  id-token: write

jobs:
  release:
    name: npm publish + GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Pinned to a commit SHA: this job holds `id-token: write`, so a mutable
        # tag here is a path to minting an npm provenance token for a tampered
        # tarball. Dependabot (github-actions ecosystem) keeps the SHA current.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1 (2026-07-17)
        with:
          # `gh release create --generate-notes` walks history between tags.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0 (2026-07-14)
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      # Defence in depth behind the tag ruleset: even if tag creation is ever
      # opened up to someone else, this job refuses to publish for any actor but
      # the owner, and refuses a tag that disagrees with the version it would
      # publish. Runs before any dependency is installed.
      - name: Assert release authority
        env:
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref_name }}
          RELEASE_OWNER: zenodinh
        run: |
          set -euo pipefail
          if [ "$ACTOR" != "$RELEASE_OWNER" ]; then
            echo "::error::Release refused: '$ACTOR' pushed $REF; only '$RELEASE_OWNER' may publish."
            exit 1
          fi
          case "$REF" in
            v*) ;;
            *) echo "::error::Release refused: '$REF' is not a v* tag."; exit 1 ;;
          esac
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "$REF" ]; then
            echo "::error::Release refused: tag '$REF' does not match package.json version '$VERSION'. Bump the version on main first, then tag that commit."
            exit 1
          fi
          echo "Authorized: $ACTOR publishing $REF"

      # Trusted Publishing (OIDC) requires npm >= 11.5.1. Node 26 ships 11.16.0,
      # so assert the floor instead of installing over it: `npm install -g
      # npm@latest` would pull whatever npm published most recently into the job
      # that mints the provenance token.
      - name: Assert npm supports Trusted Publishing
        run: |
          set -euo pipefail
          npm --version | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; }).on("close", () => {
              const version = input.trim();
              const [major, minor] = version.split(".").map(Number);
              if (!Number.isInteger(major) || !Number.isInteger(minor)) {
                console.error(`unparseable npm version "${version}"`);
                process.exit(1);
              }
              if (major < 11 || (major === 11 && minor < 5)) {
                console.error(`npm ${version} is below the 11.5.1 Trusted Publishing floor`);
                process.exit(1);
              }
              console.log(`npm ${version} meets the >= 11.5.1 Trusted Publishing floor`);
            });'

      # Idempotence: re-running a tag after a partial failure must not attempt a
      # second publish of the same version.
      - name: Is this version already on npm?
        id: npmcheck
        env:
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${REF#v}"
          if npm view "@zenodinh/pi-provider-qoder@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$VERSION is already on npm — publish will be skipped."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test

      # Publishes via Trusted Publishing (OIDC) — no NPM_TOKEN needed.
      # npm publish runs prepublishOnly (type check) again as a safety net.
      - name: Publish to npm
        if: steps.npmcheck.outputs.published == 'false'
        run: npm publish --provenance --access public

      - name: Pack and create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          npm pack
          gh release view "$REF" >/dev/null 2>&1 || gh release create "$REF" --generate-notes --title "$REF"
          gh release upload "$REF" ./*.tgz --clobber
