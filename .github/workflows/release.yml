name: Release

# Release intent is a tag or a published GitHub Release — never a merge.
#
#   - Merging a pull request cannot publish, whatever it contains. A contributor
#     bumping `package.json` is inert: the version there is not authoritative.
#   - The tag decides the version. Publish a Release in the web UI with any
#     `v<major>.<minor>.<patch>` and that is what ships, so skipped versions are
#     normal (pi does this: npm shows 0.87.1 on 2026-09-22 then 0.99.0 on
#     2026-09-29, with nothing published in between).
#   - Only the owner may publish. scripts/release-guard.ts refuses any other
#     actor, refuses a non-version tag, and refuses a version older than npm's
#     newest, because publishing one moves the `latest` dist-tag backwards for
#     every user. It is unit-tested rather than embedded in shell.
#
# Both triggers are listed because a Release published through the web UI does
# not reliably fire `push: tags` — maintainers report both behaviours, so this
# workflow does not depend on which way GitHub resolves it.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]

# Serialize re-runs of the same tag; never cancel a publish in flight.
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

permissions:
  # Required to create the GitHub Release and upload its tarball asset.
  contents: write
  # Required for npm provenance (OIDC).
  id-token: write

jobs:
  release:
    name: npm publish + GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the tagged commit
        # Pinned to a commit SHA: this job holds `id-token: write`, so a mutable
        # tag here is a path to minting an npm provenance token for a tampered
        # tarball. Dependabot (github-actions ecosystem) keeps the SHA current.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1 (2026-07-17)
        with:
          # For `release` events GITHUB_SHA is documented as the tagged commit,
          # but actions/checkout has repeatedly resolved release triggers to a
          # bare commit or detached HEAD (#1431, #2280). Naming the tag means we
          # publish the code that was released, not main as it looks now.
          ref: ${{ github.event.release.tag_name || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0 (2026-07-14)
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      # Runs before anything is installed: a refused release must not even
      # resolve the dependency tree.
      - name: Decide whether this tag may be published
        id: guard
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
          ACTOR: ${{ github.actor }}
          RELEASE_OWNER: zenodinh
        run: |
          set -euo pipefail
          # An unpublished package makes `npm view` fail; that is a first release,
          # not an error.
          LATEST="$(npm view @zenodinh/pi-provider-qoder version 2>/dev/null || true)"
          PUBLISHED=""
          if npm view "@zenodinh/pi-provider-qoder@${TAG#v}" version >/dev/null 2>&1; then
            PUBLISHED="--already-published"
          fi
          if [ -n "$LATEST" ]; then
            node scripts/release-guard.ts --tag "$TAG" --actor "$ACTOR" --owner "$RELEASE_OWNER" \
              --npm-latest "$LATEST" $PUBLISHED | tee "$RUNNER_TEMP/guard.out"
          else
            node scripts/release-guard.ts --tag "$TAG" --actor "$ACTOR" --owner "$RELEASE_OWNER" \
              $PUBLISHED | tee "$RUNNER_TEMP/guard.out"
          fi
          VERSION=""
          while IFS= read -r line; do
            case "$line" in RELEASE_VERSION=*) VERSION="${line#RELEASE_VERSION=}" ;; esac
          done < "$RUNNER_TEMP/guard.out"
          if [ -z "$VERSION" ]; then
            echo "::error::release guard produced no version"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stamp the version from the tag
        env:
          VERSION: ${{ steps.guard.outputs.version }}
        run: |
          set -euo pipefail
          # `package.json` on main is not the source of truth — the tag is.
          # `npm version` validates the string as semver, rewrites package.json
          # and keeps the lockfile's root version in sync, which `npm ci` needs.
          npm version --no-git-tag-version "$VERSION"
          node -p "'will publish ' + require('./package.json').version"

      # Trusted Publishing (OIDC) requires npm >= 11.5.1 (npm docs). Node 26
      # ships 11.16.0, so assert the floor instead of installing over it —
      # `npm install -g npm@latest` would pull whatever npm published most
      # recently into the job that mints the provenance token.
      - name: Assert npm supports Trusted Publishing
        run: |
          set -euo pipefail
          npm --version | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; }).on("close", () => {
              const version = input.trim();
              const [major, minor] = version.split(".").map(Number);
              if (!Number.isInteger(major) || !Number.isInteger(minor)) {
                console.error(`unparseable npm version "${version}"`);
                process.exit(1);
              }
              if (major < 11 || (major === 11 && minor < 5)) {
                console.error(`npm ${version} is below the 11.5.1 Trusted Publishing floor`);
                process.exit(1);
              }
              console.log(`npm ${version} meets the >= 11.5.1 Trusted Publishing floor`);
            });'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test

      # Publishes via Trusted Publishing (OIDC) — no NPM_TOKEN needed.
      # npm publish runs prepublishOnly (type check) again as a safety net.
      # Skipped when the guard saw this version already on npm, so re-running a
      # tag refreshes the GitHub Release without attempting a second publish.
      - name: Publish to npm
        env:
          VERSION: ${{ steps.guard.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "@zenodinh/pi-provider-qoder@$VERSION" version >/dev/null 2>&1; then
            echo "$VERSION is already on npm — skipping publish."
            exit 0
          fi
          npm publish --provenance --access public

      - name: Pack and create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          npm pack
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes --title "$TAG"
          gh release upload "$TAG" ./*.tgz --clobber
